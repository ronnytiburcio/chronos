# Chronos — xcodegen project definition (source of truth).
# Regenerate Chronos.xcodeproj after editing this file or adding source files:
#   xcodegen generate
name: Chronos
options:
  bundleIdPrefix: io.chronos
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"          # ad-hoc: runs locally, no Developer ID required
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Chronos:
    type: application
    platform: macOS
    sources:
      - path: Chronos
    info:
      path: Chronos/Resources/Info.plist
      properties:
        CFBundleName: Chronos
        CFBundleDisplayName: Chronos
        # ASSETCATALOG_COMPILER_APPICON_NAME compiles AppIcon.icns into the
        # bundle, but it does not write the plist key that points at it.
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "MIT License"
        NSDocumentsFolderUsageDescription: "Chronos writes your daily time archive (CSV and markdown) to the folder you choose, which defaults to Documents/Chronos."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.chronos.Chronos
        PRODUCT_NAME: Chronos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ChronosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChronosTests
    dependencies:
      - target: Chronos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.chronos.ChronosTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  Chronos:
    build:
      targets:
        Chronos: all
        ChronosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChronosTests
      gatherCoverageData: true
    archive:
      config: Release
